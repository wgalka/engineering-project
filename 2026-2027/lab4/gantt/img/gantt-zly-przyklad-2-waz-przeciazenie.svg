<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 470" width="100%" height="auto" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <rect width="1150" height="470" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>

  <!-- Top Title Bar -->
  <rect x="0" y="0" width="1150" height="44" rx="8" fill="#7f1d1d"/>
  <rect x="0" y="20" width="1150" height="24" fill="#7f1d1d"/>
  <text x="18" y="27" fill="#ffffff" font-size="15" font-weight="700">ZŁY PRZYKŁAD 2: Błędne relacje — układ czysto szeregowy oraz przeciążenie jednej osoby (300%)</text>
  <rect x="970" y="10" width="165" height="24" rx="12" fill="#ef4444"/>
  <text x="1052" y="26" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">PLAN NIEWYKONALNY</text>

  <!-- Left: Bad Pattern A (Single file snake) -->
  <rect x="16" y="58" width="545" height="285" rx="6" fill="#fffafa" stroke="#fecaca"/>
  <text x="28" y="82" fill="#991b1b" font-size="13" font-weight="700">Błąd A: Układ czysto szeregowy (brak prac równoległych)</text>
  <text x="28" y="100" fill="#64748b" font-size="11">W 4-osobowym zespole w każdej chwili pracuje tylko 1 osoba — koniec projektu wypada w marcu.</text>

  <g font-size="11" fill="#1e293b">
    <text x="28" y="128">T1. Wymagania (Ania)</text>
    <rect x="195" y="117" width="45" height="12" fill="#3b82f6"/>

    <text x="28" y="152">T2. Baza danych (Bartek)</text>
    <rect x="240" y="141" width="50" height="12" fill="#3b82f6"/>

    <text x="28" y="176">T3. Makiety UI (Celina)</text>
    <rect x="290" y="165" width="50" height="12" fill="#3b82f6"/>
    <text x="348" y="175" fill="#dc2626" font-size="10" font-weight="600">← Po co Celina czeka na bazę Bartka?!</text>

    <text x="28" y="200">T4. Konfiguracja Git (Dawid)</text>
    <rect x="340" y="189" width="40" height="12" fill="#3b82f6"/>
    <text x="386" y="199" fill="#dc2626" font-size="10" font-weight="600">← Po co repozytorium czeka na makiety?!</text>

    <text x="28" y="224">T5. Backend API (Bartek)</text>
    <rect x="380" y="213" width="60" height="12" fill="#3b82f6"/>

    <text x="28" y="248">T6. Widoki Frontend (Celina)</text>
    <rect x="440" y="237" width="55" height="12" fill="#3b82f6"/>

    <text x="28" y="272">T7. Dokumentacja (Ania)</text>
    <rect x="495" y="261" width="55" height="12" fill="#ef4444"/>
  </g>
  <line x1="485" y1="110" x2="485" y2="290" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="480" y="308" fill="#dc2626" font-size="11" font-weight="700" text-anchor="end">Koniec semestru (brak czasu na testy i oddanie!)</text>

  <!-- Right: Bad Pattern B (Resource Overload 300%) -->
  <rect x="580" y="58" width="554" height="285" rx="6" fill="#fffafa" stroke="#fecaca"/>
  <text x="594" y="82" fill="#991b1b" font-size="13" font-weight="700">Błąd B: Pozorne zrównoleglenie — 3 pełne zadania dla tej samej osoby!</text>
  <text x="594" y="100" fill="#64748b" font-size="11">Na wykresie Gantta wygląda krótko (1 tydzień), ale wszystkie 3 zadania przypisano Bartkowi:</text>

  <g font-size="11.5" fill="#1e293b">
    <text x="594" y="132">T04. Projekt i migracja bazy (6 h)</text>
    <text x="795" y="132" font-weight="700" fill="#dc2626">Bartek</text>
    <rect x="855" y="120" width="120" height="14" rx="2" fill="#3b82f6"/>

    <text x="594" y="160">T05. Implementacja autoryzacji JWT (6 h)</text>
    <text x="795" y="160" font-weight="700" fill="#dc2626">Bartek</text>
    <rect x="855" y="148" width="120" height="14" rx="2" fill="#3b82f6"/>

    <text x="594" y="188">T06. Konfiguracja serwera i CI/CD (6 h)</text>
    <text x="795" y="188" font-weight="700" fill="#dc2626">Bartek</text>
    <rect x="855" y="176" width="120" height="14" rx="2" fill="#3b82f6"/>
  </g>

  <!-- Resource Chart showing red 300% overload -->
  <rect x="594" y="212" width="524" height="114" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="606" y="232" font-size="11.5" font-weight="700" fill="#1e293b">Wykres zasobów (GanttProject / Tabela obciążenia — Tydzień 3):</text>

  <text x="606" y="258" font-size="12" font-weight="700" fill="#b91c1c">Bartek (dostępność: 6 h/tydz.)</text>
  <rect x="855" y="244" width="120" height="22" rx="3" fill="#dc2626"/>
  <text x="915" y="259" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">300% (18 h / 6 h!)</text>

  <text x="606" y="286" font-size="12" fill="#475569">Ania (dostępność: 6 h/tydz.)</text>
  <rect x="855" y="272" width="120" height="18" rx="3" fill="#e2e8f0"/>
  <text x="915" y="285" font-size="10.5" fill="#64748b" text-anchor="middle">0% (bezczynna)</text>

  <text x="606" y="312" font-size="12" fill="#475569">Celina (dostępność: 6 h/tydz.)</text>
  <rect x="855" y="298" width="120" height="18" rx="3" fill="#e2e8f0"/>
  <text x="915" y="311" font-size="10.5" fill="#64748b" text-anchor="middle">0% (bezczynna)</text>

  <!-- Summary explanation box -->
  <rect x="16" y="356" width="1118" height="98" rx="6" fill="#fef2f2" stroke="#f87171"/>
  <text x="30" y="379" fill="#991b1b" font-size="13" font-weight="700">Jak naprawić oba błędy przed oddaniem laboratorium?</text>
  <text x="30" y="401" fill="#7f1d1d" font-size="12">• Naprawa Błędu A: Po zakończeniu T1 (Wymagania) puśćcie równolegle T2 (Baza — Bartek), T3 (Makiety — Celina) oraz T4 (Repozytorium i CI — Dawid). Zaoszczędzicie 3 tygodnie kalendarzowe.</text>
  <text x="30" y="421" fill="#7f1d1d" font-size="12">• Naprawa Błędu B: Otwórzcie zakładkę „Wykres zasobów” (Resource Chart). Jeśli widzicie czerwony blok (&gt;100%), przekażcie T06 Dawidowi, a T05 przesuńcie na kolejny tydzień po T04.</text>
  <text x="30" y="441" fill="#7f1d1d" font-size="12">• Pamiętajcie: równoległe paski na wykresie Gantta mają sens TYLKO wtedy, gdy wykonują je różne osoby (lub mieszczą się w tygodniowym limicie godzin tej samej osoby).</text>
</svg>
