<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" width="100%" height="auto" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <rect width="1100" height="340" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>

  <!-- Top Title Bar -->
  <rect x="0" y="0" width="1100" height="44" rx="8" fill="#7f1d1d"/>
  <rect x="0" y="20" width="1100" height="24" fill="#7f1d1d"/>
  <text x="18" y="27" fill="#ffffff" font-size="15" font-weight="700">ZŁY PRZYKŁAD 1: Zbyt ogólny harmonogram (brak podziału WBS, właścicieli i zależności)</text>
  <rect x="920" y="10" width="165" height="24" rx="12" fill="#ef4444"/>
  <text x="1002" y="26" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">NIE DO ZALICZENIA</text>

  <!-- Headers -->
  <rect x="0" y="44" width="1100" height="36" fill="#fef2f2" stroke="#fecaca"/>
  <text x="16" y="67" fill="#7f1d1d" font-size="12" font-weight="700">Nazwa zadania</text>
  <text x="260" y="67" fill="#7f1d1d" font-size="12" font-weight="700">Kto</text>
  <line x1="250" y1="44" x2="250" y2="230" stroke="#fecaca"/>
  <line x1="340" y1="44" x2="340" y2="230" stroke="#f87171" stroke-width="2"/>

  <g font-size="12" fill="#64748b" font-weight="600" text-anchor="middle">
    <text x="460" y="67">Listopad 2026</text>
    <text x="710" y="67">Grudzień 2026</text>
    <text x="960" y="67">Styczeń 2027</text>
  </g>
  <line x1="585" y1="44" x2="585" y2="230" stroke="#e2e8f0"/>
  <line x1="835" y1="44" x2="835" y2="230" stroke="#e2e8f0"/>

  <!-- 4 vague rows -->
  <g font-size="13" fill="#1e293b">
    <text x="16" y="105">1. Analiza i baza danych</text>
    <text x="260" y="105" fill="#94a3b8">Wszyscy</text>
    <rect x="355" y="90" width="190" height="18" rx="3" fill="#60a5fa"/>

    <line x1="0" y1="118" x2="1100" y2="118" stroke="#f1f5f9"/>
    <text x="16" y="140">2. Programowanie backendu</text>
    <text x="260" y="140" fill="#94a3b8">Wszyscy</text>
    <rect x="480" y="125" width="380" height="18" rx="3" fill="#60a5fa"/>

    <line x1="0" y1="153" x2="1100" y2="153" stroke="#f1f5f9"/>
    <text x="16" y="175">3. Programowanie frontendu</text>
    <text x="260" y="175" fill="#94a3b8">Wszyscy</text>
    <rect x="520" y="160" width="390" height="18" rx="3" fill="#60a5fa"/>

    <line x1="0" y1="188" x2="1100" y2="188" stroke="#f1f5f9"/>
    <text x="16" y="210">4. Testowanie i oddanie</text>
    <text x="260" y="210" fill="#94a3b8">Wszyscy</text>
    <rect x="910" y="195" width="160" height="18" rx="3" fill="#60a5fa"/>
  </g>

  <!-- Callout Badges showing errors -->
  <rect x="12" y="240" width="1076" height="88" rx="6" fill="#fef2f2" stroke="#f87171"/>
  <text x="26" y="262" fill="#991b1b" font-size="13" font-weight="700">Dlaczego ten wykres zostanie odrzucony na przeglądzie?</text>
  <text x="26" y="282" fill="#7f1d1d" font-size="12">1. Brak dekompozycji WBS: pasek „Programowanie backendu” trwa 7 tygodni bez żadnego mierzalnego rezultatu pośredniego (nie da się ocenić postępu co 2 tygodnie).</text>
  <text x="26" y="300" fill="#7f1d1d" font-size="12">2. Brak właścicieli („Wszyscy” = nikt nie odpowiada), brak nakładu godzinowego [h], brak strzałek zależności (paski narysowane ręcznie) i zero kamieni milowych.</text>
  <text x="26" y="318" fill="#7f1d1d" font-size="12">3. Brak pierwszego przyrostu (MVP), brak integracji, brak pisania rozdziałów 4.1–4.5 dokumentacji LaTeX oraz nieuwzględniona przerwa świąteczna.</text>
</svg>
